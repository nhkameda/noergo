name: Bug report
description: Something in noergo does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Ideas and questions go to [Discussions](https://github.com/nhkameda/noergo/discussions); a vulnerability goes to a [private report](https://github.com/nhkameda/noergo/security/advisories/new), never here.

        This issue is public: leave out tokens, cookies, e-mail addresses and any note you would not publish.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a board
        2. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - noergo.com
        - A self-hosted instance
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For a self-hosted or local instance, the image tag or `git rev-parse --short HEAD`.
  - type: input
    id: client
    attributes:
      label: Browser, device or agent
      placeholder: Safari on iPhone, Firefox on Linux, ChatGPT, Claude Code…
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, console errors, server logs, with tokens and e-mail addresses removed.
