# noergo — self-hosting with Docker Compose. Read docs/self-hosting.md first.
#
#   cp docker/.env.example docker/.env      # then fill it in
#   docker compose -f docker/compose.yml --env-file docker/.env up -d
#
# Add `--profile caddy` to also run Caddy as the HTTPS reverse proxy (automatic
# certificates). Without it, point your own proxy at web (3041) and mcp (3042) using the
# routes in docker/Caddyfile. NOERGO_WEB_PORT and NOERGO_MCP_PORT move them on the host,
# to run a second instance.
#
# Each service receives only the variables it needs, listed below, and never the whole
# .env: web and mcp must not hold the database owner's or the superuser's password, or a
# bug in them could switch row-level security off. A new setting goes into &app-env.

x-app-env: &app-env
  NOERGO_PUBLIC_URL: ${NOERGO_PUBLIC_URL:?set NOERGO_PUBLIC_URL in docker/.env}
  NOERGO_ADMIN_EMAILS: ${NOERGO_ADMIN_EMAILS:-}
  NOERGO_SOURCE_URL: ${NOERGO_SOURCE_URL:-}
  SIGNUP: ${SIGNUP:-allowlist}
  SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in docker/.env}
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
  AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
  AUTH_MICROSOFT_ENTRA_ID_TENANT: ${AUTH_MICROSOFT_ENTRA_ID_TENANT:-}
  AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
  AUTH_OIDC_ID: ${AUTH_OIDC_ID:-}
  AUTH_OIDC_SECRET: ${AUTH_OIDC_SECRET:-}
  AUTH_OIDC_NAME: ${AUTH_OIDC_NAME:-}
  BILLING: ${BILLING:-off}
  STORAGE: ${STORAGE:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  NOERGO_ATTACHMENTS_ORIGIN: ${NOERGO_ATTACHMENTS_ORIGIN:-}
  DATABASE_URL: postgres://noergo_app:${NOERGO_DB_APP_PASSWORD:?}@postgres:5432/noergo

x-noergo: &noergo
  image: ghcr.io/nhkameda/noergo:${NOERGO_VERSION:-latest}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
      NOERGO_DB_MIGRATOR_PASSWORD: ${NOERGO_DB_MIGRATOR_PASSWORD:?}
      NOERGO_DB_APP_PASSWORD: ${NOERGO_DB_APP_PASSWORD:?}
      NOERGO_DB_JOBS_PASSWORD: ${NOERGO_DB_JOBS_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-noergo.sh:ro
      - ../packages/core/sql:/noergo:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noergo"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  migrate:
    <<: *noergo
    command: migrate
    restart: "no"
    environment:
      DATABASE_MIGRATOR_URL: postgres://noergo_migrator:${NOERGO_DB_MIGRATOR_PASSWORD:?}@postgres:5432/noergo
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *noergo
    command: web
    environment: *app-env
    ports: ["${NOERGO_BIND:-127.0.0.1}:${NOERGO_WEB_PORT:-3041}:3041"]
    tmpfs: ["/tmp", "/app/web/apps/web/.next/cache"]
    volumes: ["files:/data/files"]
    mem_limit: 768m

  mcp:
    <<: *noergo
    command: mcp
    environment: *app-env
    ports: ["${NOERGO_BIND:-127.0.0.1}:${NOERGO_MCP_PORT:-3042}:3042"]
    mem_limit: 384m

  worker:
    <<: *noergo
    command: worker
    environment:
      <<: *app-env
      DATABASE_JOBS_URL: postgres://noergo_jobs:${NOERGO_DB_JOBS_PASSWORD:?}@postgres:5432/noergo
    volumes: ["files:/data/files"]
    mem_limit: 512m

  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      # Not `:?`: Compose checks every service, profile or not, and would refuse to start
      # without Caddy. Left empty, the Caddyfile has no site address and Caddy itself refuses.
      NOERGO_DOMAIN: ${NOERGO_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web, mcp]

volumes:
  pgdata:
  files:
  caddy:
